name: ✅ Check
on:
    push:
        branches:
            - main
            # Feature branches run the gate on push, not only once a PR exists.
            # Without this, pushing `feature/clinical-phase-1` produced NO CI run
            # at all, so the first signal on a branch carrying the whole Phase 0.5
            # security baseline would have waited on someone opening a PR.
            - "feature/**"
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    checks: write

jobs:
    lint:
        name: 🔬 ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔬 Lint
              uses: wearerequired/lint-action@v2
              with:
                  eslint: true
                  eslint_args: "**/*.{mjs,ts,tsx}"
                  prettier: true
                  prettier_args: "--config ./.prettierrc.json \"**/*.{js,json,ts,tsx,css,md,html}\""


    typecheck:
        name: 🏷️ Typecheck
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🏷️ Typecheck
              run: npm run typecheck
              
    test-app:
        name: 🔎 Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🎭 Install Playwright browsers
              run: npx playwright install chromium-headless-shell 1>/dev/null

            - name: 🔎 Unit Tests on App
              run: CI=1 npm run test:unit:app -- --run
            - name: 🔎 Unit Tests on Supabase functions
              run: CI=1 npm run test:unit:functions -- --run
            # The harness hooks gate every agent run (validation, worktree
            # cleanup, write restrictions). They were never exercised in CI,
            # which is how a defect that made validate-on-stop validate nothing
            # — and one that deleted live worktrees — shipped unnoticed.
            - name: 🔎 Unit Tests on agent harness
              run: CI=1 npm run test:unit:claude -- --run

    # The live-database job is defined once, in .github/workflows/database.yml
    # (Phase 1D.2). deploy.yml calls the same file before its hosted database
    # deploy, because a deploy cannot wait on a job in this workflow's run, and
    # one definition keeps the two workflows from drifting apart. The draft
    # condition stays here, on the calling job, so the called workflow carries
    # no condition of its own.
    database:
        name: 🗄️ Database
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        permissions:
            contents: read
        uses: ./.github/workflows/database.yml

    e2e-test:
      timeout-minutes: 10
      runs-on: ubuntu-latest
      steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup node
        uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium-headless-shell 1>/dev/null
      - name: Install wait-on and serve
        run: npm install -g wait-on serve
      - name: Run Playwright tests
        run: make test-e2e-ci

    build:
        name: 🔨 Build
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build

            # A server-side credential in a browser artifact is unrecoverable
            # once deployed: the bundle is public and the key is valid. The
            # only thing keeping SERVICE_ROLE_KEY out is Vite's `VITE_` prefix
            # rule, which one typo inverts silently.
            - name: 🔒 No secrets in the production build
              run: npm run scan:build
