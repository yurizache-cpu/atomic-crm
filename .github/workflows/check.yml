name: ✅ Check
on:
    push:
        branches:
            - main
            # Feature branches run the gate on push, not only once a PR exists.
            # Without this, pushing `feature/clinical-phase-1` produced NO CI run
            # at all, so the first signal on a branch carrying the whole Phase 0.5
            # security baseline would have waited on someone opening a PR.
            - "feature/**"
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    checks: write

jobs:
    lint:
        name: 🔬 ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔬 Lint
              uses: wearerequired/lint-action@v2
              with:
                  eslint: true
                  eslint_args: "**/*.{mjs,ts,tsx}"
                  prettier: true
                  prettier_args: "--config ./.prettierrc.json \"**/*.{js,json,ts,tsx,css,md,html}\""


    typecheck:
        name: 🏷️ Typecheck
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🏷️ Typecheck
              run: npm run typecheck
              
    test-app:
        name: 🔎 Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🎭 Install Playwright browsers
              run: npx playwright install chromium-headless-shell 1>/dev/null

            - name: 🔎 Unit Tests on App
              run: CI=1 npm run test:unit:app -- --run
            - name: 🔎 Unit Tests on Supabase functions
              run: CI=1 npm run test:unit:functions -- --run
            # The harness hooks gate every agent run (validation, worktree
            # cleanup, write restrictions). They were never exercised in CI,
            # which is how a defect that made validate-on-stop validate nothing
            # — and one that deleted live worktrees — shipped unnoticed.
            - name: 🔎 Unit Tests on agent harness
              run: CI=1 npm run test:unit:claude -- --run

    # The database guarantees are the ones this project actually rests on, and
    # until now nothing executed them anywhere but one developer's machine.
    # `npm run test:db` fails closed when it cannot reach a database, so this job
    # cannot silently degrade into a no-op the way a skipped suite would.
    database:
        name: 🗄️ Database security & reproducibility
        runs-on: ubuntu-latest
        timeout-minutes: 25
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        env:
            # Derived from `project_id` in supabase/config.toml. The runner
            # requires this to be named rather than guessed: on a machine with
            # more than one Supabase stack, attaching to the wrong database
            # would silently verify the wrong schema.
            SUPABASE_DB_CONTAINER: supabase_db_atomic-crm-demo
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🐘 Start Supabase
              run: npx supabase start

            # Runs the hand-written security migrations' own assertions as a
            # side effect: each raises if its end state is wrong.
            - name: 🔒 RLS, tenant isolation and grant surface
              run: npm run test:db

            # The worker runtime against a real Postgres, through the real
            # `pg` pool and the real constrained login role. The SQL suites
            # above cannot cover this: they prove the DATABASE's behaviour with
            # psql, and say nothing about whether the application driver's
            # connection reuse carries a tenant from one job into the next.
            # Spawns real worker processes for the concurrency cases.
            - name: ⚙️ Worker runtime, pooling and concurrency
              run: npm run test:db:engine

            # Proves the database can be rebuilt from the repository alone. The
            # seed once inserted into a table no migration created, so a clean
            # reconstruction was impossible and nothing caught it.
            - name: ♻️ Clean reconstruction from scratch
              run: npx supabase db reset --local

            - name: 🔒 Same guarantees after the reset
              run: npm run test:db

    e2e-test:
      timeout-minutes: 10
      runs-on: ubuntu-latest
      steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup node
        uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium-headless-shell 1>/dev/null
      - name: Install wait-on and serve
        run: npm install -g wait-on serve
      - name: Run Playwright tests
        run: make test-e2e-ci

    build:
        name: 🔨 Build
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build
